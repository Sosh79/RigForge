name: Release RigForge

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  release:
    name: Build & Publish Release
    runs-on: windows-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup .NET 8 SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore Dependencies
        run: dotnet restore RigForge.sln

      - name: Build & Publish Standalone Executable
        run: |
          dotnet publish RigForge/RigForge.csproj -c Release -r win-x64 --self-contained true -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true -o ./publish

      - name: Upload to GitHub Releases
        uses: softprops/action-gh-release@v2
        with:
          name: RigForge ${{ github.ref_name }}
          files: ./publish/RigForge.exe
          generate_release_notes: true
          draft: false
          prerelease: false
